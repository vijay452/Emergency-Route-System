services:
  - type: web
    name: emergency-route-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: web
    name: emergency-route-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "sh -c \"echo \\\"window.ERS_API_BASE='${ERS_API_BASE:-}'\\\" > runtime-config.js\""
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: ERS_API_BASE
        sync: false
